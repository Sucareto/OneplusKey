[versions]
compileSdk = "37"
targetSdk = "37"
minSdk = "34"
buildTools = "37.0.0"
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
libsu = "6.0.0"
libxposed = "102.0.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
